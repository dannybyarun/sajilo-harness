name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: type-check the relay plugin
        # The plugin is loaded by opencode's own bundler, which does NOT
        # type-check - but it does fail on scope errors, and a stray brace in a
        # big file can silently move a function out of scope (the relay then
        # fails to load and the instance looks dead). This catches that class of
        # mistake before it ships.
        #
        # bunx installs typescript on first use and SAYS SO on stdout, and
        # that noise lands in the file this step then asserts is empty - so
        # the step failed on bun's install chatter instead of on a type
        # error. The cache is warmed first, where the noise does not matter.
        run: |
          bunx tsc --version >/dev/null 2>&1 || true
          bunx tsc --noEmit --skipLibCheck --target esnext --module esnext \
            --moduleResolution bundler --lib esnext,dom \
            plugin/sajilo-relay.ts bin/sajilo-relay.ts bin/sajilo-doctor.ts 2>&1 \
            | grep -vE "TS2591|TS2868|TS2307|Cannot find name 'process'|Cannot find name 'Bun'|Cannot find type definition|Entry point of type library|If you have issues related to imports|The file is in the program because|Resolving dependencies|Resolved, downloaded|Saved lockfile" \
            | tee /tmp/tsc.txt
          test ! -s /tmp/tsc.txt

      - name: syntax-check the shell launchers
        run: |
          bash -n sajilo
          bash -n install.sh
          bash -n bin/sajilo-rebrand.sh
          bash -n bin/warp-rotate.sh
          bash -n bin/tunnel-watchdog.sh

      - name: unit tests
        run: bun test

      - name: catalogue drift
        # The relay learns the live free-model catalogue at runtime, but the
        # offline seed must stay in step: a new free model, a removed one, or a
        # changed token window fails here instead of shipping as a 200k window
        # on a 1M model. An unreachable gateway is not drift (exit 0).
        run: bun tools/check-catalogue.ts

      - name: build the relay
        run: bun build --target=bun --external "@opencode/plugin" --external "node:*" plugin/sajilo-relay.ts --outdir /tmp/build
